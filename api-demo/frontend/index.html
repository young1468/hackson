        const ENDINGS = [

        const rand = (a, b) => a + Math.random() * (b - a);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const shuffle = items => {
          const out = items.slice();
          for (let i = out.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));

        const sceneBgFromKey = key => {
          const map = {

          };
          return map[key] || map.city;
        };

        const normalizeDelta = effects => {
          const out = {};
          for (const item of STATS) {
            const value = Number(effects && effects[item.key]);
            out[item.key] = Number.isFinite(value) ? clamp(value, -25, 25) : 0;
          }
          return out;
        };

        const normalizeApiEvent = (event, role) => {
          if (!event || typeof event.story !== "string" || !Array.isArray(event.choices)) return null;
          const choices = event.choices.slice(0, 2);
          if (choices.length !== 2) return null;

            id: `api-${Date.now()}-${Math.random().toString(16).slice(2)}`,

        const postJson = async (path, payload) => {
          const controller = new AbortController();
          const timer = window.setTimeout(() => controller.abort(), 15000);
          try {
            const response = await fetch(`${API_BASE}${path}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: controller.signal
            });
            if (!response.ok) throw new Error(`API ${response.status}`);
            return await response.json();
          } finally {
            window.clearTimeout(timer);

        };

        const safe = { t: 0, r: 0, b: 0, l: 0 };
        const readSafe = () => {
          const cs = getComputedStyle(document.documentElement);
          const px = k => parseFloat(cs.getPropertyValue(k)) || 0;
          safe.t = px("--sat");
          safe.r = px("--sar");
          safe.b = px("--sab");
          safe.l = px("--sal");
        };

        let dpr = Math.min(2, window.devicePixelRatio || 1);
        let viewW = 0;
        let viewH = 0;
        let scale = 1;
        let ox = 0;
        let oy = 0;

        const noise = document.createElement("canvas");
        const nctx = noise.getContext("2d");
        const makeNoise = () => {
          noise.width = 220;
          noise.height = 220;
          const img = nctx.createImageData(noise.width, noise.height);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = (Math.random() * 255) | 0;
            img.data[i] = v;
            img.data[i + 1] = v;
            img.data[i + 2] = v;
            img.data[i + 3] = 18;
          }
          nctx.putImageData(img, 0, 0);
        };

        const shadow = (blur, alpha) => {
          ctx.shadowColor = `rgba(12, 16, 30, ${alpha})`;
          ctx.shadowBlur = blur;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = Math.max(2, Math.round(blur * 0.25));
        };
        const clearShadow = () => {
          ctx.shadowColor = "transparent";
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;
        };

        const roundRect = (x, y, w, h, r) => {
          const rr = Math.min(r, w * 0.5, h * 0.5);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        };

        const splitText = (text, maxW, font) => {
          ctx.save();
          ctx.font = font;
          const lines = [];
          const paragraphs = String(text || "").split("\n");
          for (const paragraph of paragraphs) {
            const words = paragraph.split("");
            let line = "";
            for (let i = 0; i < words.length; i++) {
              const next = line + words[i];
              const w = ctx.measureText(next).width;
              if (w > maxW && line) {
                lines.push(line);
                line = words[i];
              } else {
                line = next;
              }
            }
            if (line) lines.push(line);
          }
          ctx.restore();
          return lines;
        };

        const btns = [];
        const hitTest = (x, y) => {
          for (let i = btns.length - 1; i >= 0; i--) {
            const b = btns[i];
            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
          }
          return null;
        };

        const audio = { ctx: null, master: null };
        const ensureAudio = () => {
          if (audio.ctx) return;
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audio.ctx = new AC();
          audio.master = audio.ctx.createGain();
          audio.master.gain.value = 0.08;
          audio.master.connect(audio.ctx.destination);
        };
        const beep = (freq, dur, type) => {
          if (!audio.ctx || !audio.master) return;
          const t0 = audio.ctx.currentTime;
          const o = audio.ctx.createOscillator();
          const g = audio.ctx.createGain();
          o.type = type || "sine";
          o.frequency.setValueAtTime(freq, t0);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(0.9, t0 + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g);
          g.connect(audio.master);
          o.start(t0);
          o.stop(t0 + dur + 0.02);
        };

        const nowMs = () => performance.now();

        const store = {
          bestScore: 0,
          bestTitle: "",
          bestAt: 0
        };
        const loadStore = () => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed.bestScore === "number") store.bestScore = parsed.bestScore;
            if (parsed && typeof parsed.bestTitle === "string") store.bestTitle = parsed.bestTitle;
            if (parsed && typeof parsed.bestAt === "number") store.bestAt = parsed.bestAt;
          } catch (_) {}
        };
        const saveStore = () => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
          } catch (_) {}
        };

        const state = {
          view: "start",
          role: null,
          step: 0,
          steps: [],
          stats: { mood: 50, money: 50, luck: 50, crazy: 50 },
          history: [],
          toast: "",
          toastAt: 0,
          animAt: 0,
          sparkles: [],
          ending: null,
          share: "",
          locked: false,
          pendingResult: null,
          loading: false,
          endingLoading: false,
          runId: 0
        };

        const freshRun = () => {
          const role = pick(ROLES);
          state.runId += 1;
          state.view = "play";
          state.role = role;
          state.step = 0;
          state.steps = [];
          state.stats = { ...role.base };
          state.history = [];
          state.toast = "命运生成中……";
          state.toastAt = nowMs();
          state.animAt = nowMs();
          state.ending = null;
          state.share = "";
          state.locked = true;
          state.pendingResult = null;
          state.loading = true;
          state.endingLoading = false;
          loadNextScene(state.runId);
        };

        const apiHistory = () => state.history.map(item => ({
          story: item.text,
          choice: item.choice,
          result: item.result
        }));

        const getFallbackScene = () => {
          const pool = EVENTS[state.role.id] || EVENTS.student;
          const used = new Set(state.steps.filter(Boolean).map(scene => scene.id));
          const candidates = pool.filter(scene => !used.has(scene.id));
          return pick(candidates.length ? candidates : pool);
        };

        const loadNextScene = async runId => {
          const fallback = getFallbackScene();
          try {
            const event = await postJson("/api/next", {
              role: state.role.name,
              step: state.step + 1,
              stats: state.stats,
              history: apiHistory()
            });
            if (runId !== state.runId) return;
            state.steps[state.step] = normalizeApiEvent(event, state.role) || fallback;
            state.toast = "";
          } catch (_) {
            if (runId !== state.runId) return;
            state.steps[state.step] = fallback;
            state.toast = "哎呀，命运卡住了，请再试一次~ 已使用本地剧情。";
            state.toastAt = nowMs();
          }
          state.loading = false;
          state.locked = false;
          state.animAt = nowMs();
        };

        const addSpark = (x, y, n) => {
          for (let i = 0; i < n; i++) {
            state.sparkles.push({
              x,
              y,
              vx: rand(-0.7, 0.7),
              vy: rand(-1.6, -0.3),

              life: rand(420, 780),
              born: nowMs(),
              hue: rand(28, 190)
            });
          }
        };

        const applyDelta = delta => {
          for (const item of STATS) {
            const k = item.key;
            const v = typeof delta[k] === "number" ? delta[k] : 0;
            state.stats[k] = clamp(state.stats[k] + v, 0, 100);
          }
        };

        const choose = idx => {
          if (state.locked || state.loading) return;
          const scene = state.steps[state.step];
          if (!scene) return;
          const choice = scene.choices[idx];
          state.locked = true;
          ensureAudio();
          if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume().catch(() => {});
          beep(idx === 0 ? 520 : 430, 0.09, "triangle");
          applyDelta(choice.delta || {});
          state.history.push({ sceneId: scene.id, text: scene.text, choice: choice.text, result: choice.result });
          state.pendingResult = choice.result;
          state.toast = choice.result;
          state.toastAt = nowMs();
          state.animAt = nowMs();
          addSpark(LOGICAL_W * 0.5, LOGICAL_H * 0.78, 22);

        const continueAfterResult = () => {

          state.pendingResult = null;
          state.toast = "";
          if (state.step >= TOTAL_STEPS - 1) {
            finish();
            return;

          state.step += 1;
          state.locked = true;
          state.loading = true;
          state.toast = "命运生成中……";
          state.toastAt = nowMs();
          state.animAt = nowMs();
          loadNextScene(state.runId);
        };

        const scoreNow = () => {
          return Math.round((state.stats.mood * 1.1 + state.stats.money * 0.8 + state.stats.luck * 1.1 + state.stats.crazy * 0.7) / 4 * 100);

        const localEnding = () => {
          const s = state.stats;

          return {
            title: ending.title,

            shareText: `我在《一分钟人生岔路口》里活成了：${ending.title}`
          };

        const setEnding = ending => {

          state.animAt = nowMs();
          const sc = scoreNow();

            store.bestTitle = clean.title;
            store.bestAt = Date.now();
            saveStore();
          }
        };

        const finish = () => {
          state.view = "ending";
          state.endingLoading = true;
          state.ending = { title: "命运生成中……", desc: "AI 正在整理你的一分钟人生，请稍等。" };

          state.animAt = nowMs();
          loadEnding(state.runId);

        const loadEnding = async runId => {

            });
          } catch (_) {

            state.toastAt = nowMs();

        const copyShare = () => {

          beep(720, 0.06, "square");

            state.toast = "你的浏览器不支持一键复制，可以长按截图分享。";
            state.toastAt = nowMs();
          }
        };

        const styleText = (size, weight) => {
          const w = weight ? `${weight} ` : "";
          return `${w}${size}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif`;
        };

        const toLogical = (px, py) => {
          const x = (px * dpr - ox) / scale;
          const y = (py * dpr - oy) / scale;
          return { x, y };
        };

        const resize = () => {
          readSafe();
          dpr = Math.min(2, window.devicePixelRatio || 1);
          const rect = wrap.getBoundingClientRect();
          viewW = Math.max(1, Math.floor(rect.width));
          viewH = Math.max(1, Math.floor(rect.height));
          canvas.width = Math.floor(viewW * dpr);
          canvas.height = Math.floor(viewH * dpr);
          const s = Math.min(canvas.width / LOGICAL_W, canvas.height / LOGICAL_H);
          scale = s;
          ox = Math.floor((canvas.width - LOGICAL_W * scale) * 0.5);
          oy = Math.floor((canvas.height - LOGICAL_H * scale) * 0.5);
          ctx.imageSmoothingEnabled = true;
          ctx.textBaseline = "alphabetic";
        };

        const bgGrad = (spec, t) => {
          const g = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
          const tw = (spec.time || "day");
          if (tw === "morning") {
            g.addColorStop(0, "#fff1c9");
            g.addColorStop(0.45, "#c8f3ff");
            g.addColorStop(1, "#fff6ef");
          } else if (tw === "sunset") {
            g.addColorStop(0, "#ffd1dc");
            g.addColorStop(0.55, "#bde0fe");
            g.addColorStop(1, "#f7f0ff");
          } else if (tw === "evening") {
            g.addColorStop(0, "#bde0fe");
            g.addColorStop(0.55, "#ffd6a5");
            g.addColorStop(1, "#f9f6ff");
          } else if (tw === "night") {
            g.addColorStop(0, "#0b1020");
            g.addColorStop(0.55, "#17214b");
            g.addColorStop(1, "#07111f");
          } else {
            g.addColorStop(0, "#f7f0ff");
            g.addColorStop(0.48, "#dff9fb");
            g.addColorStop(1, "#fff6e8");
          }
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

          const pulse = 0.6 + 0.4 * Math.sin(t * 0.00075);
          ctx.globalAlpha = 0.52;
          const g2 = ctx.createRadialGradient(LOGICAL_W * 0.22, LOGICAL_H * 0.2, 0, LOGICAL_W * 0.22, LOGICAL_H * 0.2, LOGICAL_W * 0.55);
          g2.addColorStop(0, `rgba(255, 209, 102, ${0.48 * pulse})`);
          g2.addColorStop(1, "rgba(255, 209, 102, 0)");
          ctx.fillStyle = g2;
          ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
          const g3 = ctx.createRadialGradient(LOGICAL_W * 0.84, LOGICAL_H * 0.18, 0, LOGICAL_W * 0.84, LOGICAL_H * 0.18, LOGICAL_W * 0.6);
          g3.addColorStop(0, `rgba(79, 209, 197, ${0.38 * pulse})`);
          g3.addColorStop(1, "rgba(79, 209, 197, 0)");
          ctx.fillStyle = g3;
          ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
          ctx.globalAlpha = 1;
        };

        const drawCloud = (x, y, s, alpha) => {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "rgba(255,255,255,.92)";
          ctx.beginPath();
          ctx.ellipse(x, y, 38 * s, 26 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 36 * s, y - 10 * s, 34 * s, 24 * s, 0, 0, Math.PI * 2);
          ctx.ellipse(x + 70 * s, y, 42 * s, 28 * s, 0, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };

        const sceneDecor = (spec, t) => {
          const type = spec.type || "city";
          const tt = (t * 0.00007) % 1;
          if (type === "room" || type === "home") {
            ctx.save();
            ctx.globalAlpha = 1;
            ctx.fillStyle = "rgba(18,24,38,.06)";
            ctx.fillRect(0, LOGICAL_H * 0.62, LOGICAL_W, LOGICAL_H * 0.38);
            shadow(18, 0.12);
            roundRect(LOGICAL_W * 0.08, LOGICAL_H * 0.64, LOGICAL_W * 0.84, LOGICAL_H * 0.3, 26);
            ctx.fillStyle = "rgba(255,255,255,.65)";
            ctx.fill();
            clearShadow();
            ctx.globalAlpha = 1;
            ctx.fillStyle = "rgba(255, 255, 255, .55)";
            roundRect(LOGICAL_W * 0.12, LOGICAL_H * 0.69, LOGICAL_W * 0.22, LOGICAL_H * 0.12, 20);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 214, 165, .55)";
            roundRect(LOGICAL_W * 0.38, LOGICAL_H * 0.68, LOGICAL_W * 0.5, LOGICAL_H * 0.16, 22);
            ctx.fill();
            ctx.fillStyle = "rgba(82, 209, 196, .35)";
            roundRect(LOGICAL_W * 0.14, LOGICAL_H * 0.84, LOGICAL_W * 0.72, LOGICAL_H * 0.08, 999);
            ctx.fill();
            ctx.restore();
          } else if (type === "park") {
            ctx.save();
            ctx.fillStyle = "rgba(16, 170, 120, .16)";
            ctx.beginPath();
            ctx.ellipse(LOGICAL_W * 0.5, LOGICAL_H * 0.86, LOGICAL_W * 0.62, LOGICAL_H * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(16, 170, 120, .26)";
            ctx.beginPath();
            ctx.ellipse(LOGICAL_W * 0.24, LOGICAL_H * 0.9, LOGICAL_W * 0.3, LOGICAL_H * 0.13, 0, 0, Math.PI * 2);
            ctx.ellipse(LOGICAL_W * 0.78, LOGICAL_H * 0.9, LOGICAL_W * 0.35, LOGICAL_H * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();
            shadow(12, 0.1);
            ctx.fillStyle = "rgba(255,255,255,.74)";
            roundRect(LOGICAL_W * 0.58, LOGICAL_H * 0.66, LOGICAL_W * 0.28, LOGICAL_H * 0.1, 18);
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(255, 214, 165, .55)";
            roundRect(LOGICAL_W * 0.6, LOGICAL_H * 0.7, LOGICAL_W * 0.24, LOGICAL_H * 0.02, 999);
            ctx.fill();
            drawCloud(LOGICAL_W * (0.2 + 0.22 * tt), LOGICAL_H * 0.18, 1.05, 0.8);
            drawCloud(LOGICAL_W * (0.62 - 0.22 * tt), LOGICAL_H * 0.24, 0.9, 0.7);
            ctx.restore();
          } else if (type === "cafe" || type === "nightMarket") {
            ctx.save();
            ctx.fillStyle = "rgba(18, 24, 38, .08)";
            ctx.fillRect(0, LOGICAL_H * 0.62, LOGICAL_W, LOGICAL_H * 0.38);
            shadow(18, 0.14);
            roundRect(LOGICAL_W * 0.06, LOGICAL_H * 0.66, LOGICAL_W * 0.88, LOGICAL_H * 0.26, 26);
            ctx.fillStyle = "rgba(255,255,255,.62)";
            ctx.fill();
            clearShadow();
            const bulbs = 10;
            for (let i = 0; i < bulbs; i++) {
              const x = LOGICAL_W * 0.12 + i * (LOGICAL_W * 0.76 / (bulbs - 1));
              const y = LOGICAL_H * 0.16 + 10 * Math.sin(t * 0.002 + i);
              ctx.fillStyle = `hsla(${38 + i * 12}, 95%, 70%, .9)`;
              ctx.beginPath();
              ctx.arc(x, y, 7, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          } else if (type === "office") {
            ctx.save();
            ctx.fillStyle = "rgba(18,24,38,.08)";
            ctx.fillRect(0, LOGICAL_H * 0.62, LOGICAL_W, LOGICAL_H * 0.38);
            shadow(18, 0.16);
            roundRect(LOGICAL_W * 0.09, LOGICAL_H * 0.66, LOGICAL_W * 0.82, LOGICAL_H * 0.22, 26);
            ctx.fillStyle = "rgba(255,255,255,.64)";
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(77, 132, 255, .18)";
            roundRect(LOGICAL_W * 0.15, LOGICAL_H * 0.69, LOGICAL_W * 0.42, LOGICAL_H * 0.12, 20);
            ctx.fill();
            ctx.fillStyle = "rgba(255, 209, 102, .2)";
            roundRect(LOGICAL_W * 0.6, LOGICAL_H * 0.7, LOGICAL_W * 0.18, LOGICAL_H * 0.1, 18);
            ctx.fill();
            ctx.restore();
          } else if (type === "library") {
            ctx.save();
            ctx.fillStyle = "rgba(18,24,38,.06)";
            ctx.fillRect(0, LOGICAL_H * 0.62, LOGICAL_W, LOGICAL_H * 0.38);
            shadow(18, 0.12);
            roundRect(LOGICAL_W * 0.08, LOGICAL_H * 0.66, LOGICAL_W * 0.84, LOGICAL_H * 0.26, 26);
            ctx.fillStyle = "rgba(255,255,255,.66)";
            ctx.fill();
            clearShadow();
            for (let i = 0; i < 6; i++) {
              ctx.fillStyle = `rgba(${60 + i * 18}, ${90 + i * 14}, ${130 + i * 9}, .18)`;
              roundRect(LOGICAL_W * (0.12 + i * 0.12), LOGICAL_H * 0.69, LOGICAL_W * 0.09, LOGICAL_H * 0.18, 16);
              ctx.fill();
            }
            ctx.restore();
          } else if (type === "roof") {
            ctx.save();
            ctx.fillStyle = "rgba(255,255,255,.08)";
            ctx.beginPath();
            ctx.ellipse(LOGICAL_W * 0.5, LOGICAL_H * 0.78, LOGICAL_W * 0.72, LOGICAL_H * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();
            for (let i = 0; i < 22; i++) {
              const x = (i / 21) * LOGICAL_W;
              const y = LOGICAL_H * 0.58 + 10 * Math.sin(i * 1.3 + t * 0.002);
              ctx.fillStyle = `rgba(255, 209, 102, ${0.08 + 0.04 * Math.sin(i + t * 0.003)})`;
              ctx.fillRect(x, y, 18, 160);
            }
            ctx.restore();
          } else {
            ctx.save();
            drawCloud(LOGICAL_W * (0.24 + 0.2 * tt), LOGICAL_H * 0.18, 1.05, 0.78);
            drawCloud(LOGICAL_W * (0.68 - 0.2 * tt), LOGICAL_H * 0.26, 0.92, 0.7);
            ctx.fillStyle = "rgba(18,24,38,.05)";
            ctx.fillRect(0, LOGICAL_H * 0.66, LOGICAL_W, LOGICAL_H * 0.34);
            shadow(14, 0.1);
            ctx.fillStyle = "rgba(255,255,255,.7)";
            roundRect(LOGICAL_W * 0.08, LOGICAL_H * 0.69, LOGICAL_W * 0.2, LOGICAL_H * 0.18, 22);
            ctx.fill();
            roundRect(LOGICAL_W * 0.32, LOGICAL_H * 0.68, LOGICAL_W * 0.22, LOGICAL_H * 0.2, 22);
            ctx.fill();
            roundRect(LOGICAL_W * 0.58, LOGICAL_H * 0.7, LOGICAL_W * 0.28, LOGICAL_H * 0.16, 22);
            ctx.fill();
            clearShadow();
            ctx.restore();
          }
        };

        const portraitCache = new Map();
        const portraitKey = role => `${role.id}`;

        const drawPortraitTo = (role, size) => {
          const c = document.createElement("canvas");
          c.width = size;
          c.height = size;
          const g = c.getContext("2d");
          const rr = (x, y, w, h, r) => {
            const rad = Math.min(r, w * 0.5, h * 0.5);
            g.beginPath();
            g.moveTo(x + rad, y);
            g.arcTo(x + w, y, x + w, y + h, rad);
            g.arcTo(x + w, y + h, x, y + h, rad);
            g.arcTo(x, y + h, x, y, rad);
            g.arcTo(x, y, x + w, y, rad);
            g.closePath();
          };
          const p = role.palette;
          const cx = size * 0.5;
          const cy = size * 0.52;
          const headR = size * 0.34;
          const bg = g.createLinearGradient(0, 0, size, size);
          bg.addColorStop(0, p.b);
          bg.addColorStop(1, p.a);
          g.fillStyle = bg;
          g.fillRect(0, 0, size, size);
          g.fillStyle = "rgba(255,255,255,.2)";
          g.beginPath();
          g.ellipse(size * 0.75, size * 0.28, size * 0.28, size * 0.2, -0.4, 0, Math.PI * 2);
          g.fill();

          g.save();
          g.shadowColor = "rgba(0,0,0,.18)";
          g.shadowBlur = size * 0.08;
          g.shadowOffsetY = size * 0.05;
          g.fillStyle = "rgba(255,255,255,.64)";
          g.beginPath();
          g.arc(cx, cy, headR * 1.12, 0, Math.PI * 2);
          g.fill();
          g.restore();

          g.fillStyle = p.skin;
          g.beginPath();
          g.arc(cx, cy, headR, 0, Math.PI * 2);
          g.fill();

          const hair = role.portrait.hair;
          g.fillStyle = p.hair;
          g.beginPath();
          if (hair === "short") {
            g.arc(cx, cy - headR * 0.22, headR * 1.02, Math.PI * 1.05, Math.PI * 1.95);
          } else if (hair === "side") {
            g.ellipse(cx - headR * 0.18, cy - headR * 0.34, headR * 1.06, headR * 0.86, -0.25, Math.PI, Math.PI * 2);
          } else if (hair === "bun") {
            g.arc(cx, cy - headR * 0.38, headR * 1.0, Math.PI, Math.PI * 2);
            g.moveTo(cx, cy - headR * 1.06);
            g.arc(cx, cy - headR * 1.06, headR * 0.34, 0, Math.PI * 2);
          } else if (hair === "wave") {
            g.arc(cx, cy - headR * 0.22, headR * 1.04, Math.PI * 1.05, Math.PI * 1.95);
            g.ellipse(cx - headR * 0.48, cy + headR * 0.05, headR * 0.2, headR * 0.64, 0.1, 0, Math.PI * 2);
            g.ellipse(cx + headR * 0.48, cy + headR * 0.05, headR * 0.2, headR * 0.64, -0.1, 0, Math.PI * 2);
          } else if (hair === "cap") {
            g.arc(cx, cy - headR * 0.42, headR * 1.0, Math.PI, 0);
            g.rect(cx - headR * 1.0, cy - headR * 0.42, headR * 2.0, headR * 0.46);
          } else {
            g.arc(cx, cy - headR * 0.28, headR * 1.02, Math.PI * 1.04, Math.PI * 1.96);
          }
          g.closePath();
          g.fill();

          const eyeY = cy - headR * 0.02;
          const eyeX = headR * 0.42;
          g.fillStyle = "rgba(18,24,38,.9)";
          g.beginPath();
          g.ellipse(cx - eyeX, eyeY, headR * 0.12, headR * 0.16, 0, 0, Math.PI * 2);
          g.ellipse(cx + eyeX, eyeY, headR * 0.12, headR * 0.16, 0, 0, Math.PI * 2);
          g.fill();

          g.fillStyle = "rgba(255,255,255,.85)";
          g.beginPath();
          g.arc(cx - eyeX + headR * 0.05, eyeY - headR * 0.05, headR * 0.05, 0, Math.PI * 2);
          g.arc(cx + eyeX + headR * 0.05, eyeY - headR * 0.05, headR * 0.05, 0, Math.PI * 2);
          g.fill();

          g.strokeStyle = "rgba(18,24,38,.7)";
          g.lineWidth = Math.max(2, size * 0.015);
          g.lineCap = "round";
          g.beginPath();
          g.moveTo(cx - headR * 0.16, cy + headR * 0.32);
          g.quadraticCurveTo(cx, cy + headR * 0.4, cx + headR * 0.16, cy + headR * 0.32);
          g.stroke();

          const acc = role.portrait.acc;
          if (acc === "book") {
            g.save();
            g.translate(cx + headR * 0.62, cy + headR * 0.5);
            g.rotate(-0.18);
            g.fillStyle = "rgba(255,255,255,.78)";
            g.fillRect(-size * 0.16, -size * 0.08, size * 0.28, size * 0.18);
            g.fillStyle = "rgba(18,24,38,.18)";
            g.fillRect(-size * 0.12, -size * 0.04, size * 0.2, size * 0.02);
            g.restore();
          } else if (acc === "tie") {
            g.save();
            g.translate(cx, cy + headR * 0.9);
            g.fillStyle = "rgba(6, 214, 160, .9)";
            g.beginPath();
            g.moveTo(0, 0);
            g.lineTo(-headR * 0.18, headR * 0.3);
            g.lineTo(0, headR * 0.48);
            g.lineTo(headR * 0.18, headR * 0.3);
            g.closePath();
            g.fill();
            g.restore();
          } else if (acc === "laptop") {
            g.save();
            g.translate(cx - headR * 0.9, cy + headR * 0.75);
            g.fillStyle = "rgba(255,255,255,.78)";
            rr(0, 0, headR * 0.9, headR * 0.56, headR * 0.12);
            g.fill();
            g.fillStyle = "rgba(18,24,38,.16)";
            rr(headR * 0.08, headR * 0.08, headR * 0.74, headR * 0.32, headR * 0.08);
            g.fill();
            g.restore();
          } else if (acc === "paw") {
            g.save();
            g.translate(cx + headR * 0.72, cy + headR * 0.52);
            g.fillStyle = "rgba(255,255,255,.78)";
            g.beginPath();
            g.arc(0, 0, headR * 0.22, 0, Math.PI * 2);
            g.arc(-headR * 0.18, -headR * 0.2, headR * 0.1, 0, Math.PI * 2);
            g.arc(headR * 0.18, -headR * 0.2, headR * 0.1, 0, Math.PI * 2);
            g.arc(0, -headR * 0.28, headR * 0.1, 0, Math.PI * 2);
            g.fill();
            g.restore();
          } else if (acc === "band") {
            g.save();
            g.strokeStyle = "rgba(255, 209, 102, .9)";
            g.lineWidth = size * 0.06;
            g.lineCap = "round";
            g.beginPath();
            g.arc(cx, cy - headR * 0.66, headR * 0.86, Math.PI * 1.1, Math.PI * 1.9);
            g.stroke();
            g.restore();
          } else if (acc === "compass") {
            g.save();
            g.translate(cx - headR * 0.86, cy + headR * 0.55);
            g.fillStyle = "rgba(255,255,255,.78)";
            g.beginPath();
            g.arc(0, 0, headR * 0.22, 0, Math.PI * 2);
            g.fill();
            g.strokeStyle = "rgba(18,24,38,.45)";
            g.lineWidth = Math.max(2, size * 0.01);
            g.beginPath();
            g.moveTo(0, -headR * 0.14);
            g.lineTo(0, headR * 0.14);
            g.moveTo(-headR * 0.14, 0);
            g.lineTo(headR * 0.14, 0);
            g.stroke();
            g.restore();
          }

          g.save();
          g.globalAlpha = 0.18;
          g.fillStyle = "rgba(0,0,0,1)";
          g.fillRect(0, 0, size, size);
          g.globalCompositeOperation = "screen";
          g.globalAlpha = 0.28;
          g.drawImage(noise, 0, 0, size, size);
          g.restore();
          return c;
        };

        const getPortrait = role => {
          const key = portraitKey(role);
          if (portraitCache.has(key)) return portraitCache.get(key);
          const c = drawPortraitTo(role, 240);
          portraitCache.set(key, c);
          return c;
        };

        const drawTopBar = (t) => {
          const pad = 26;
          const h = 150;
          shadow(16, 0.14);
          roundRect(pad, pad, LOGICAL_W - pad * 2, h, 24);
          ctx.fillStyle = "rgba(255,255,255,.72)";
          ctx.fill();
          clearShadow();

          ctx.fillStyle = "#0f172a";
          ctx.font = styleText(30, 900);
          ctx.fillText("一分钟人生岔路口", pad + 22, pad + 48);

          ctx.font = styleText(20, 800);
          ctx.fillStyle = "rgba(48, 62, 88, .82)";
          const stepText =
            state.view === "play"
              ? `第 ${Math.min(state.step + 1, TOTAL_STEPS)} / ${TOTAL_STEPS} 步 · ${state.role.name}`
              : `${state.role ? state.role.name : ""}`;

          ctx.fillText(stepText, pad + 22, pad + 82);

          const statX0 = pad + 22;
          const statY0 = pad + 100;
          const gap = 10;
          const itemW = (LOGICAL_W - pad * 2 - 40 - gap * 3) / 4;
          for (let i = 0; i < STATS.length; i++) {
            const it = STATS[i];
            const x = statX0 + i * (itemW + gap);
            const v = state.stats[it.key];
            ctx.fillStyle = "rgba(18,24,38,.55)";
            ctx.font = styleText(15, 800);
            ctx.fillText(it.label, x, statY0 + 16);
            ctx.font = styleText(15, 900);
            ctx.textAlign = "right";
            ctx.fillText(String(v), x + itemW, statY0 + 16);
            ctx.textAlign = "left";
            roundRect(x, statY0 + 26, itemW, 14, 999);
            ctx.fillStyle = "rgba(18,24,38,.09)";
            ctx.fill();
            roundRect(x, statY0 + 26, itemW * (v / 100), 10, 999);
            const g = ctx.createLinearGradient(x, 0, x + itemW, 0);
            g.addColorStop(0, it.c0);
            g.addColorStop(1, it.c1);
            ctx.fillStyle = g;
            ctx.fill();
          }
        };

        const drawBubble = (x, y, w, h, tipX) => {
          shadow(18, 0.16);
          roundRect(x, y, w, h, 26);
          ctx.fillStyle = "rgba(255,255,255,.86)";
          ctx.fill();
          clearShadow();
          ctx.beginPath();
          ctx.moveTo(tipX, y + h);
          ctx.lineTo(tipX + 22, y + h);
          ctx.lineTo(tipX + 6, y + h + 22);
          ctx.closePath();
          ctx.fillStyle = "rgba(255,255,255,.86)";
          ctx.fill();
        };

        const drawButton = (b, label, variant, disabled, t) => {
          const press = b.down ? 1 : 0;
          const lift = 1 - press;
          const x = b.x;
          const y = b.y + press * 4;
          const w = b.w;
          const h = b.h;
          const r = 22;
          const base = variant === "primary" ? "#ffd166" : variant === "mint" ? "#b8f2e6" : "#e9eef7";
          const top = variant === "primary" ? "#ffe6a3" : variant === "mint" ? "#e6fff9" : "#f6f8fc";
          const textC = variant === "ghost" ? "rgba(18,24,38,.82)" : "rgba(18,24,38,.88)";
          const alpha = disabled ? 0.55 : 1;

          ctx.save();
          ctx.globalAlpha = alpha;
          shadow(18, 0.18 * lift);
          roundRect(x, y, w, h, r);
          const g = ctx.createLinearGradient(x, y, x, y + h);
          g.addColorStop(0, top);
          g.addColorStop(1, base);
          ctx.fillStyle = g;
          ctx.fill();
          clearShadow();

          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(18,24,38,.08)";
          roundRect(x + 1, y + 1, w - 2, h - 2, r - 1);
          ctx.stroke();

          ctx.fillStyle = textC;
          ctx.font = styleText(24, 900);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const wobble = b.hot ? 1 + 0.02 * Math.sin(t * 0.014) : 1;
          ctx.save();
          ctx.translate(x + w * 0.5, y + h * 0.5);
          ctx.scale(wobble, wobble);
          ctx.fillText(label, 0, 0);
          ctx.restore();
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
          ctx.restore();
        };

        const drawToast = (t) => {
          if (!state.toast) return;
          const age = nowMs() - state.toastAt;
          const dur = 1400;
          const alpha = age < 260 ? age / 260 : age > dur ? 0 : age > dur - 360 ? (dur - age) / 360 : 1;
          if (alpha <= 0) return;
          const w = LOGICAL_W * 0.84;
          const x = (LOGICAL_W - w) * 0.5;
          const y = LOGICAL_H * 0.61;
          shadow(22, 0.18);
          roundRect(x, y, w, 86, 22);
          ctx.fillStyle = `rgba(18,24,38,${0.78 * alpha})`;
          ctx.fill();
          clearShadow();
          ctx.fillStyle = `rgba(255,255,255,${0.95 * alpha})`;
          ctx.font = styleText(18, 800);
          const lines = splitText(state.toast, w - 36, ctx.font);
          const line = lines.length > 1 ? lines.slice(0, 2).join(" ") : lines[0];
          ctx.fillText(line, x + 18, y + 52);
        };

        const drawSparkles = (t) => {
          if (!state.sparkles.length) return;
          const alive = [];
          for (const s of state.sparkles) {
            const age = t - s.born;
            if (age > s.life) continue;
            const k = age / s.life;
            const x = s.x + s.vx * age;
            const y = s.y + s.vy * age + 0.0014 * age * age;
            const a = (1 - k) * 0.85;
            ctx.fillStyle = `hsla(${s.hue}, 92%, 70%, ${a})`;
            ctx.beginPath();
            ctx.arc(x, y, s.r * (1 - k * 0.4), 0, Math.PI * 2);
            ctx.fill();
            alive.push(s);
          }
          state.sparkles = alive;
        };

        const drawStart = (t) => {
          btns.length = 0;
          bgGrad({ type: "start", time: "day" }, t);
          sceneDecor({ type: "city", time: "day" }, t);

          const cx = LOGICAL_W * 0.5;
          const cy = LOGICAL_H * 0.34;
          ctx.save();
          shadow(28, 0.18);
          roundRect(LOGICAL_W * 0.08, LOGICAL_H * 0.18, LOGICAL_W * 0.84, LOGICAL_H * 0.34, 30);
          ctx.fillStyle = "rgba(255,255,255,.78)";
          ctx.fill();
          clearShadow();
          ctx.restore();

          ctx.fillStyle = "rgba(18,24,38,.9)";
          ctx.font = styleText(58, 900);
          ctx.textAlign = "center";
          ctx.fillText("一分钟人生岔路口", cx, LOGICAL_H * 0.26);

          ctx.font = styleText(24, 800);
          ctx.fillStyle = "rgba(48,62,88,.85)";
          ctx.fillText("6 次选择，生成你的一分钟平行人生。", cx, LOGICAL_H * 0.35);

          ctx.font = styleText(19, 700);
          ctx.fillStyle = "rgba(66,82,110,.75)";
          ctx.fillText("AI 正在实时编织你的另一种人生", cx, LOGICAL_H * 0.41);

          ctx.textAlign = "left";

          const b = { id: "start", x: LOGICAL_W * 0.14, y: LOGICAL_H * 0.58, w: LOGICAL_W * 0.72, h: 94, down: false, hot: false };
          btns.push(b);
          drawButton(b, "开始人生", "primary", false, t);

          const b2 = { id: "how", x: LOGICAL_W * 0.14, y: LOGICAL_H * 0.7, w: LOGICAL_W * 0.72, h: 84, down: false, hot: false };
          btns.push(b2);
          drawButton(b2, "玩法说明", "ghost", false, t);

          if (store.bestScore > 0) {
            const w = LOGICAL_W * 0.84;
            const x = (LOGICAL_W - w) * 0.5;
            const y = LOGICAL_H * 0.82;
            shadow(16, 0.12);
            roundRect(x, y, w, 92, 22);
            ctx.fillStyle = "rgba(255,255,255,.72)";
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(18,24,38,.84)";
            ctx.font = styleText(16, 900);
            ctx.fillText("最高纪录", x + 18, y + 38);
            ctx.font = styleText(16, 800);
            ctx.fillStyle = "rgba(48,62,88,.85)";
            ctx.fillText(`${store.bestScore} 分 · ${store.bestTitle || "已记录"}`, x + 18, y + 66);
          }
        };

        const drawHow = (t) => {
          btns.length = 0;
          bgGrad({ type: "start", time: "evening" }, t);
          sceneDecor({ type: "library", time: "evening" }, t);
          const pad = 26;
          shadow(24, 0.16);
          roundRect(pad, LOGICAL_H * 0.16, LOGICAL_W - pad * 2, LOGICAL_H * 0.56, 30);
          ctx.fillStyle = "rgba(255,255,255,.82)";
          ctx.fill();
          clearShadow();

          ctx.fillStyle = "rgba(18,24,38,.9)";
          ctx.font = styleText(42, 900);
          ctx.fillText("玩法说明", pad + 20, LOGICAL_H * 0.22);

          ctx.font = styleText(24, 800);
          ctx.fillStyle = "rgba(48,62,88,.86)";

          const text =
          "每局随机获得 1 个身份，并抽取 6 个不重复场景。\n" +
          "每一步只有两个选项：点一下先看结果，再点继续进入下一幕。\n" +
          "属性包括心态、钱包、运气、离谱值。\n" +
          "最后根据属性生成荒诞结局，并支持复制分享文案。";

          const lines = text.split("\n");

          let y = LOGICAL_H * 0.29;

          for (const line of lines) {
            ctx.fillText(line, pad + 20, y);
            y += 42;
          }

          const b = { id: "back", x: LOGICAL_W * 0.14, y: LOGICAL_H * 0.76, w: LOGICAL_W * 0.72, h: 88, down: false, hot: false };
          btns.push(b);
          drawButton(b, "返回", "mint", false, t);
        };

        const drawPlay = (t) => {
          btns.length = 0;
          const scene = state.steps[state.step] || {
            bg: sceneBgFromKey(state.role ? state.role.id : "city"),
            text: "命运生成中……",
            choices: []
          };
          bgGrad(scene.bg, t);
          sceneDecor(scene.bg, t);
          drawTopBar(t);

          const portrait = getPortrait(state.role);
          const pSize = 176;
          const px = LOGICAL_W * 0.72;
          const py = LOGICAL_H * 0.16;
          shadow(20, 0.18);
          roundRect(px, py, pSize, pSize, 24);
          ctx.fillStyle = "rgba(255,255,255,.72)";
          ctx.fill();
          clearShadow();
          ctx.save();
          ctx.beginPath();
          roundRect(px + 8, py + 8, pSize - 16, pSize - 16, 18);
          ctx.clip();
          ctx.drawImage(portrait, px + 8, py + 8, pSize - 16, pSize - 16);
          ctx.restore();

          ctx.fillStyle = "rgba(18,24,38,.84)";
          ctx.font = styleText(16, 900);
          ctx.fillText(state.role.badge, px, py + pSize + 28);

          const bubbleW = LOGICAL_W * 0.86;
          const bubbleX = (LOGICAL_W - bubbleW) * 0.5;
          const hasPrevious = state.history.length && !state.pendingResult;
          if (hasPrevious) {
            const prev = state.history[state.history.length - 1].result;
            const prevY = LOGICAL_H * 0.37;
            shadow(14, 0.1);
            roundRect(bubbleX, prevY, bubbleW, 84, 22);
            ctx.fillStyle = "rgba(255,255,255,.64)";
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(18,24,38,.56)";
            ctx.font = styleText(14, 900);
            ctx.fillText("上一幕", bubbleX + 22, prevY + 27);
            ctx.font = styleText(16, 800);
            ctx.fillStyle = "rgba(48,62,88,.82)";
            const prevLines = splitText(prev, bubbleW - 44, ctx.font);
            for (let i = 0; i < Math.min(prevLines.length, 2); i++) {
              ctx.fillText(prevLines[i], bubbleX + 22, prevY + 55 + i * 24);
            }
          }
          const bubbleY = hasPrevious ? LOGICAL_H * 0.46 : LOGICAL_H * 0.42;
          const bubbleH = hasPrevious ? 190 : 214;
          drawBubble(bubbleX, bubbleY, bubbleW, bubbleH, bubbleX + bubbleW * 0.22);

          ctx.fillStyle = "rgba(18,24,38,.56)";
          ctx.font = styleText(15, 900);
          ctx.fillText("这一幕", bubbleX + 28, bubbleY + 36);
          ctx.fillStyle = "rgba(18,24,38,.9)";
          ctx.font = styleText(22, 900);
          const storyText = state.loading ? "命运生成中……\nAI 正在续写你的下一幕。" : scene.text;
          const lines = splitText(storyText, bubbleW - 54, ctx.font);
          let y = bubbleY + 74;
          for (let i = 0; i < Math.min(lines.length, hasPrevious ? 3 : 4); i++) {
            ctx.fillText(lines[i], bubbleX + 28, y);
            y += 34;
          }

          const by = LOGICAL_H * 0.72;
          const gap = 16;
          const bw = (LOGICAL_W * 0.86 - gap) * 0.5;
          const bx0 = (LOGICAL_W - (bw * 2 + gap)) * 0.5;
          if (state.loading) {
            const rw = LOGICAL_W * 0.86;
            const rx = (LOGICAL_W - rw) * 0.5;
            const ry = LOGICAL_H * 0.71;
            shadow(18, 0.12);
            roundRect(rx, ry, rw, 112, 26);
            ctx.fillStyle = "rgba(255,255,255,.78)";
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(18,24,38,.78)";
            ctx.font = styleText(18, 900);
            ctx.fillText("命运生成中……", rx + 22, ry + 42);
            ctx.font = styleText(15, 800);
            ctx.fillStyle = "rgba(48,62,88,.76)";
            ctx.fillText(`正在请求 ${API_BASE}`, rx + 22, ry + 74);
          } else if (state.pendingResult) {
            const rw = LOGICAL_W * 0.86;
            const rx = (LOGICAL_W - rw) * 0.5;
            const ry = LOGICAL_H * 0.69;
            shadow(18, 0.16);
            roundRect(rx, ry, rw, 150, 26);
            ctx.fillStyle = "rgba(255,255,255,.86)";
            ctx.fill();
            clearShadow();
            ctx.fillStyle = "rgba(18,24,38,.9)";
            ctx.font = styleText(18, 900);
            ctx.fillText("这一选择带来的结果", rx + 22, ry + 36);
            ctx.font = styleText(18, 800);
            ctx.fillStyle = "rgba(48,62,88,.88)";
            const resultLines = splitText(state.pendingResult, rw - 44, ctx.font);
            for (let i = 0; i < Math.min(resultLines.length, 2); i++) {
              ctx.fillText(resultLines[i], rx + 22, ry + 72 + i * 28);
            }
            const b = { id: "continue", x: LOGICAL_W * 0.14, y: LOGICAL_H * 0.84, w: LOGICAL_W * 0.72, h: 86, down: false, hot: false };
            btns.push(b);
            drawButton(b, state.step >= TOTAL_STEPS - 1 ? "查看结局" : `继续 → 第 ${state.step + 2} / ${TOTAL_STEPS} 步`, "primary", false, t);
          } else {
            const b1 = { id: "c0", x: bx0, y: by, w: bw, h: 112, down: false, hot: false, disabled: state.locked };
            const b2 = { id: "c1", x: bx0 + bw + gap, y: by, w: bw, h: 112, down: false, hot: false, disabled: state.locked };
            btns.push(b1, b2);
            drawButton(b1, scene.choices[0] ? scene.choices[0].text : "等待命运", "primary", state.locked, t);
            drawButton(b2, scene.choices[1] ? scene.choices[1].text : "稍等一下", "mint", state.locked, t);
          }

          drawToast(t);
          drawSparkles(t);

          ctx.save();
          ctx.globalAlpha = 0.22;
          ctx.globalCompositeOperation = "overlay";
          ctx.drawImage(noise, 0, 0, LOGICAL_W, LOGICAL_H);
          ctx.restore();
        };

        const drawEnding = (t) => {
          btns.length = 0;
          bgGrad({ type: "ending", time: "sunset" }, t);
          sceneDecor({ type: "roof", time: "sunset" }, t);
          drawTopBar(t);

          const pad = 26;
          shadow(22, 0.16);
          roundRect(pad, LOGICAL_H * 0.2, LOGICAL_W - pad * 2, LOGICAL_H * 0.42, 30);
          ctx.fillStyle = "rgba(255,255,255,.82)";
          ctx.fill();
          clearShadow();

          const title = state.ending ? state.ending.title : "结局";
          const desc = state.ending ? state.ending.desc : "";
          ctx.fillStyle = "rgba(18,24,38,.9)";
          ctx.font = styleText(36, 900);
          const titleLines = splitText(title, LOGICAL_W - pad * 2 - 40, ctx.font);
          for (let i = 0; i < Math.min(titleLines.length, 2); i++) {
            ctx.fillText(titleLines[i], pad + 20, LOGICAL_H * 0.255 + i * 42);
          }

          ctx.font = styleText(18, 800);
          ctx.fillStyle = "rgba(48,62,88,.88)";
          const lines = splitText(desc, LOGICAL_W - pad * 2 - 40, ctx.font);
          let y = LOGICAL_H * 0.31 + (titleLines.length > 1 ? 28 : 0);
          for (let i = 0; i < Math.min(lines.length, 5); i++) {
            ctx.fillText(lines[i], pad + 20, y);
            y += 30;
          }

          const shareW = LOGICAL_W - pad * 2;
          const shareX = pad;
          const shareY = LOGICAL_H * 0.64;
          shadow(18, 0.12);
          roundRect(shareX, shareY, shareW, 132, 26);
          ctx.fillStyle = "rgba(255,255,255,.72)";
          ctx.fill();
          clearShadow();
          ctx.fillStyle = "rgba(18,24,38,.88)";
          ctx.font = styleText(16, 900);
          ctx.fillText("分享文案", shareX + 18, shareY + 34);
          const shareText = state.share || "";
          ctx.font = styleText(shareText.length > 42 ? 14 : 15, 800);
          ctx.fillStyle = "rgba(48,62,88,.86)";
          const shareLines = splitText(shareText, shareW - 36, ctx.font);
          for (let i = 0; i < Math.min(shareLines.length, 3); i++) {
            ctx.fillText(shareLines[i], shareX + 18, shareY + 66 + i * 22);
          }

          const by = LOGICAL_H * 0.8;
          const gap = 16;
          const bw = (LOGICAL_W * 0.86 - gap) * 0.5;
          const bx0 = (LOGICAL_W - (bw * 2 + gap)) * 0.5;
          const b1 = { id: "copy", x: bx0, y: by, w: bw, h: 104, down: false, hot: false, disabled: state.endingLoading };
          const b2 = { id: "again", x: bx0 + bw + gap, y: by, w: bw, h: 104, down: false, hot: false };
          btns.push(b1, b2);
          drawButton(b1, state.endingLoading ? "生成中" : "复制文案", "primary", state.endingLoading, t);
          drawButton(b2, "再来一次", "mint", false, t);

          drawToast(t);
          drawSparkles(t);

          ctx.save();
          ctx.globalAlpha = 0.2;
          ctx.globalCompositeOperation = "overlay";
          ctx.drawImage(noise, 0, 0, LOGICAL_W, LOGICAL_H);
          ctx.restore();
        };

        const drawFrame = (t) => {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.setTransform(scale, 0, 0, scale, ox, oy);
          ctx.globalAlpha = 1;
          ctx.textAlign = "left";
          if (state.view === "start") drawStart(t);
          else if (state.view === "how") drawHow(t);
          else if (state.view === "play") drawPlay(t);
          else drawEnding(t);
        };

        let pointerId = null;
        const setHot = (x, y) => {
          let changed = false;
          for (const b of btns) {
            const hot = x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
            if (!!b.hot !== hot) changed = true;
            b.hot = hot;
          }
          return changed;
        };

        canvas.addEventListener("pointerdown", (e) => {
          pointerId = e.pointerId;
          canvas.setPointerCapture(pointerId);
          const p = toLogical(e.clientX, e.clientY);
          const b = hitTest(p.x, p.y);
          if (b) {
            b.down = true;
            ensureAudio();
            if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume().catch(() => {});
            beep(360, 0.04, "sine");
          }
          setHot(p.x, p.y);
        }, { passive: true });

        canvas.addEventListener("pointermove", (e) => {
          const p = toLogical(e.clientX, e.clientY);
          setHot(p.x, p.y);
        }, { passive: true });

        canvas.addEventListener("pointerup", (e) => {
          const p = toLogical(e.clientX, e.clientY);
          const b = hitTest(p.x, p.y);
          for (const it of btns) it.down = false;
          if (!b) return;
          if (b.disabled) return;
          if (state.view === "start") {
            if (b.id === "start") {
              freshRun();
              return;
            }
            if (b.id === "how") {
              state.view = "how";
              state.animAt = nowMs();
              return;
            }
          } else if (state.view === "how") {
            if (b.id === "back") {
              state.view = "start";
              state.animAt = nowMs();
              return;
            }
          } else if (state.view === "play") {
            if (b.id === "c0") choose(0);
            else if (b.id === "c1") choose(1);
            else if (b.id === "continue") continueAfterResult();
          } else if (state.view === "ending") {
            if (b.id === "copy") copyShare();
            else if (b.id === "again") {
              state.runId += 1;
              state.view = "start";
              state.animAt = nowMs();
              state.toast = "";
              state.loading = false;
              state.endingLoading = false;
              addSpark(LOGICAL_W * 0.5, LOGICAL_H * 0.62, 18);
              beep(520, 0.08, "triangle");
            }
          }
        }, { passive: true });

        canvas.addEventListener("pointercancel", () => {
          pointerId = null;
          for (const it of btns) it.down = false;
        }, { passive: true });

        const loop = (t) => {
          drawFrame(t);
          requestAnimationFrame(loop);
        };

        loadStore();
        makeNoise();
        resize();
        window.addEventListener("resize", resize, { passive: true });
        window.addEventListener("orientationchange", () => window.setTimeout(resize, 60), { passive: true });
        requestAnimationFrame(loop);
      } catch (_) {
        const fatal = document.getElementById("fatal");
        if (fatal) {
          fatal.style.display = "flex";
          const p = fatal.querySelector("p");
          if (p) p.textContent = ERROR_TEXT;
        }
      }
    })();
  </script>
</body>
</html>
