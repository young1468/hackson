<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3e8">
<title>一分钟人生岔路口</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#18202f;
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(circle at 14% 12%,rgba(255,214,102,.55),transparent 28%),
      radial-gradient(circle at 88% 10%,rgba(79,209,197,.42),transparent 30%),
      linear-gradient(160deg,#f7f3e8 0%,#eaf5f2 47%,#f5e8ef 100%);
  }
  .app{
    width:100%;min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .card{
    width:min(100%,440px);
    display:flex;flex-direction:column;gap:18px;
    padding:22px;
    border:1px solid rgba(24,32,47,.12);
    border-radius:14px;
    background:rgba(255,255,255,.82);
    box-shadow:0 18px 55px rgba(55,62,78,.16);
    backdrop-filter:blur(14px);
    animation:rise .26s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  h1,h2,h3,p{margin:0}
  h1{font-size:32px;line-height:1.1}
  h2{font-size:24px;line-height:1.18}
  .topline{color:#4e5a6d;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .subtitle{color:#536174;font-size:16px;line-height:1.65}

  /* progress dots */
  .dots{display:flex;gap:6px}
  .dots i{flex:1;height:4px;border-radius:2px;background:rgba(24,32,47,.12);transition:background .25s}
  .dots i.done{background:#2bb3a3}
  .dots i.now{background:#ffcf5a}

  /* story */
  .story{
    min-height:120px;
    padding:16px;
    border:1px solid rgba(24,32,47,.1);
    border-radius:10px;
    background:#fffdf8;
    font-size:18px;line-height:1.65;
    white-space:pre-wrap;
    cursor:pointer;
    position:relative;
  }
  .story .hint{
    position:absolute;right:10px;bottom:6px;
    font-size:11px;color:#8a93a3;opacity:0;transition:opacity .2s;
  }
  .story.typing .hint{opacity:1}
  .story .caret{display:inline-block;width:6px;height:1em;vertical-align:-2px;background:#2bb3a3;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* role / ending */
  .role-box,.ending-box{
    padding:16px;border-radius:10px;background:#fffdf8;
    border:1px solid rgba(24,32,47,.1);
  }
  .role-name{font-size:28px;font-weight:800;margin-bottom:6px}
  .reel{
    height:42px;overflow:hidden;font-size:30px;font-weight:800;
    color:#18202f;letter-spacing:.5px;
  }
  .reel .track{display:flex;flex-direction:column;transition:transform .42s cubic-bezier(.2,.7,.2,1)}
  .reel .track > div{height:42px;line-height:42px}

  /* stats */
  .stats{display:grid;gap:10px}
  .stat{position:relative}
  .stat-head{display:flex;justify-content:space-between;font-size:13px;color:#435064;margin-bottom:4px}
  .stat-head strong{font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:999px;background:rgba(24,32,47,.09);overflow:hidden}
  .bar > span{display:block;height:100%;width:50%;border-radius:inherit;background:linear-gradient(90deg,#2bb3a3,#f2bf4d);transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .delta{
    position:absolute;right:0;top:-2px;font-size:12px;font-weight:700;
    pointer-events:none;opacity:0;
  }
  .delta.up{color:#1f9e72}
  .delta.down{color:#c2533a}
  .delta.show{animation:floatUp 1s ease-out forwards}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(6px)}
    15%{opacity:1}
    100%{opacity:0;transform:translateY(-18px)}
  }

  /* buttons */
  .choices{display:grid;gap:10px}
  button{
    width:100%;min-height:50px;border:0;border-radius:10px;
    padding:13px 16px;font:inherit;font-weight:700;color:#172033;
    background:#ffcf5a;box-shadow:0 8px 18px rgba(140,105,26,.18);
    cursor:pointer;touch-action:manipulation;
    transition:transform .08s ease, opacity .2s;
  }
  button:active:not(:disabled){transform:translateY(1px)}
  button.secondary{background:#d9f0ed;box-shadow:none}
  button.ghost{background:#eef1f5;box-shadow:none;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px}
  .row button{flex:1}

  .result{
    padding:12px 14px;
    border-left:4px solid #2bb3a3;
    border-radius:6px;
    background:rgba(43,179,163,.1);
    color:#263247;font-size:14px;line-height:1.55;
    animation:rise .25s ease-out;
  }
  .result b{display:block;margin-bottom:5px;font-size:15px;color:#172033}
  .result p{margin:0}

  .recap{
    display:grid;gap:8px;max-height:200px;overflow-y:auto;
    padding:12px;border-radius:10px;background:#fffdf8;
    border:1px solid rgba(24,32,47,.08);
    font-size:13px;line-height:1.5;color:#3d4757;
  }
  .recap div{display:flex;gap:8px}
  .recap b{flex:0 0 18px;color:#2bb3a3;font-weight:700}

  .share{
    user-select:text;padding:13px;border-radius:10px;
    background:#eef1f5;color:#263247;line-height:1.5;font-size:14px;
  }
  .toast{
    min-height:20px;color:#a45038;font-size:13px;text-align:center;
    transition:opacity .2s;
  }

  /* tutorial */
  .rules{display:grid;gap:10px;padding:14px;border-radius:10px;background:#fffdf8;border:1px solid rgba(24,32,47,.1);font-size:14px;line-height:1.6;color:#3d4757}
  .rules .item{display:flex;gap:10px}
  .rules .item b{flex:0 0 56px;color:#18202f;font-weight:700}
  .stat-hint{font-size:12px;color:#7a8497;line-height:1.5;padding:0 2px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#2bb3a3;color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
  .meta{font-size:12px;color:#7a8497;text-align:center}

  @media (max-width:360px){
    .app{padding:12px}
    .card{padding:18px;gap:14px}
    h1{font-size:28px}
    .story{font-size:16px;min-height:100px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>

  // 显式权重：specificity 越大越优先匹配

  // ====== 工具 ======
  const $ = (sel, root=document) => root.querySelector(sel);
  const el = (tag, attrs={}, ...children) => {
    const node = document.createElement(tag);
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "style") node.setAttribute("style", attrs[k]);
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) node.setAttribute(k, attrs[k]);
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return node;
  };
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const shuffle = arr => {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  };

  // ====== 状态 ======
  const state = {
    view: "start",      // start | role | play | ending
    role: null,
    stats: {mood:50,money:50,luck:50,crazy:50},
    step: 0,
    eventQueue: [],
    history: [],
    ending: null
  };

  const app = $("#app");
  let typingTimer = null;
  let onSkipType = null;

  // ====== 本地存档（localStorage 可能不可用，做兜底） ======
  const store = (() => {
    const mem = {};
    let ok = false;
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
    return {
      get(k){ try { return ok ? localStorage.getItem(k) : mem[k]; } catch(e){ return mem[k]; } },
      set(k,v){ try { if (ok) localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } }
    };
  })();
  const SEEN_KEY = "lcr.seen";
  const UNLOCKED_KEY = "lcr.endings";
  function getUnlocked(){
    try { return JSON.parse(store.get(UNLOCKED_KEY) || "[]"); } catch(e){ return []; }
  }
  function addUnlocked(rawTitle){
    const list = getUnlocked();
    if (list.includes(rawTitle)) return false;
    list.push(rawTitle);
    store.set(UNLOCKED_KEY, JSON.stringify(list));
    return true;
  }

  // ====== 持久化的 stat 节点（避免重建丢失动画） ======
  // 每个 view 自己造，这里就不缓存了

  function mount(node){
    app.replaceChildren(node);

  function viewStart(){

        el("div",{class:"item"}, el("b",{},"② 做 6 次选择"), el("span",{},"每个岔路口两个选项，没有对错。选择会改变你的 4 项属性。")),
        el("div",{class:"item"}, el("b",{},"③ 看结局"), el("span",{},"最终属性的组合会决定一个荒诞结局。共有 "+ENDINGS.length+" 种，每次都可能不同。"))
      ),
      el("div",{class:"rules"},
        el("div",{class:"item"}, el("b",{},"心态"), el("span",{},"你今天的精神状态。")),
        el("div",{class:"item"}, el("b",{},"钱包"), el("span",{},"你身上的钱，归零也能继续。")),
        el("div",{class:"item"}, el("b",{},"运气"), el("span",{},"事情会不会突然朝奇怪方向反转。")),
        el("div",{class:"item"}, el("b",{},"离谱值"), el("span",{},"故事的荒诞程度，越高越魔幻，没有好坏。"))
      ),
      el("button",{onclick:()=>{ store.set(SEEN_KEY,"1"); startRoll(); }}, "我懂了，开始抽签"),

    mount(card);

  // 抽签动画
  function startRoll(){
    state.view = "role";
    const names = shuffle(ROLES.map(r=>r.name));
    // 最终落点
    const finalRole = pick(ROLES);
    state.role = finalRole;

    const track = el("div",{class:"track"});
    // 构造一个长滚动序列，末尾是 finalRole
    const reelItems = [];
    for (let i=0;i<10;i++) reelItems.push(pick(names));
    reelItems.push(finalRole.name);
    reelItems.forEach(n => track.appendChild(el("div",{},n)));

    const reel = el("div",{class:"reel"}, track);

    const card = el("section",{class:"card"},
      el("div",{class:"topline"}, el("span",{},"命运抽签中…"), el("span",{},"")),
      reel,
      el("p",{class:"subtitle",id:"rollDesc"},"正在为你抽取今天的身份。"),
      el("button",{disabled:"",id:"enterBtn"},"进入人生")
    );
    mount(card);

    // 触发滚动动画
    requestAnimationFrame(()=>{
      const target = (reelItems.length-1) * 42;
      track.style.transform = `translateY(-${target}px)`;
    });

    setTimeout(()=>{
      // 落定后：把 stats 装上，desc 替换
      finalizeRoll(finalRole);
    }, 600);
  }

  function finalizeRoll(role){
    state.stats = {...role.stats};
    state.step = 0;
    state.eventQueue = shuffle(EVENTS[role.id]).slice(0, TOTAL_STEPS);
    state.history = [];

    const card = el("section",{class:"card"},
      el("div",{class:"topline"}, el("span",{},"命运抽签完成"), el("span",{},"")),
      el("div",{class:"role-box"},
        el("div",{class:"role-name"}, role.name),
        el("p",{class:"subtitle"}, role.desc)
      ),
      el("p",{class:"stat-hint"},"下方是你的起始属性，每次选择都会让它们上下变化（0–100）。"),
      statsBlock(state.stats),
      el("button",{onclick:enterPlay},"进入人生"),
      el("button",{class:"ghost",onclick:startRoll},"换个身份")
    );
    mount(card);
  }

  function statsBlock(stats){
    const wrap = el("div",{class:"stats"});
    STAT_KEYS.forEach(k=>{
      const value = stats[k];
      wrap.appendChild(
        el("div",{class:"stat","data-stat":k},
          el("div",{class:"stat-head"},
            el("span",{},STAT_LABELS[k]),
            el("strong",{class:"val"}, String(value))
          ),
          el("div",{class:"bar"}, el("span",{style:`width:${value}%`})),
          el("div",{class:"delta"})
        )
      );
    });
    return wrap;
  }

  function updateStatsDOM(root, oldStats, newStats){
    STAT_KEYS.forEach(k=>{
      const stat = root.querySelector(`.stat[data-stat="${k}"]`);
      if (!stat) return;
      const val = stat.querySelector(".val");
      const bar = stat.querySelector(".bar > span");
      const delta = stat.querySelector(".delta");
      const diff = newStats[k] - oldStats[k];
      val.textContent = String(newStats[k]);
      bar.style.width = newStats[k] + "%";
      if (diff !== 0){
        delta.className = "delta " + (diff>0?"up":"down");
        delta.textContent = (diff>0?"+":"") + diff;
        // 重启动画
        delta.classList.remove("show");
        void delta.offsetWidth;
        delta.classList.add("show");
      }
    });
  }

  function enterPlay(){
    state.view = "play";
    state.step = 1;
    renderPlay();
  }

  function renderPlay(){
    const ev = state.eventQueue[state.step-1];
    const dots = el("div",{class:"dots"});
    for (let i=1;i<=TOTAL_STEPS;i++){
      const cls = i < state.step ? "done" : (i === state.step ? "now" : "");
      dots.appendChild(el("i",{class:cls}));
    }

    const stats = statsBlock(state.stats);
    const story = el("div",{class:"story typing"},
      el("span",{class:"text"}),
      el("span",{class:"caret"}),
      el("span",{class:"hint"},"点击跳过")
    );

    const choices = el("div",{class:"choices"});
    ev.choices.forEach((c,i)=>{
      const btn = el("button",{
        class: i===1 ? "secondary" : "",
        disabled: "",
        onclick: () => onChoose(c, stats, story, choices, ev)
      }, c.text);
      choices.appendChild(btn);
    });

    const card = el("section",{class:"card"},
      el("div",{class:"topline"},
        el("span",{}, `第 ${state.step} / ${TOTAL_STEPS} 步`),
        el("span",{}, `身份：${state.role.name}`)
      ),
      dots,
      stats,
      story,
      choices
    );
    mount(card);

    typeText(story, storyWithBridge(ev.story), () => {
      choices.querySelectorAll("button").forEach(b => b.disabled = false);
    });
  }

  function storyWithBridge(text){
    if (!state.history.length) return text;
    const last = state.history[state.history.length - 1];
    return `上一幕：${last.result}\n\n${text}`;
  }

  function typeText(storyNode, text, done){
    const target = storyNode.querySelector(".text");
    const caret = storyNode.querySelector(".caret");
    target.textContent = "";
    let i = 0;
    if (typingTimer) clearInterval(typingTimer);
    const finish = () => {
      if (typingTimer){ clearInterval(typingTimer); typingTimer = null; }
      target.textContent = text;
      caret.style.display = "none";
      storyNode.classList.remove("typing");
      storyNode.onclick = null;
      onSkipType = null;
      done && done();
    };
    onSkipType = finish;
    storyNode.onclick = () => onSkipType && onSkipType();
    typingTimer = setInterval(()=>{
      target.textContent += text[i] || "";
      i += 1;
      if (i >= text.length) finish();
    }, 22);
  }

  function onChoose(choice, statsNode, storyNode, choicesNode, ev){
    // 二次保护
    if (choicesNode.dataset.locked) return;
    choicesNode.dataset.locked = "1";
    choicesNode.querySelectorAll("button").forEach(b => b.disabled = true);

    const oldStats = {...state.stats};
    const newStats = {...state.stats};
    STAT_KEYS.forEach(k => newStats[k] = clamp(newStats[k] + (choice.effects[k]||0), 0, 100));
    state.stats = newStats;
    state.history.push({ step: state.step, story: ev.story, choice: choice.text, result: choice.result, effects: choice.effects });

    updateStatsDOM(statsNode, oldStats, newStats);

    // 结果框 + 继续按钮（不再自动跳）
    const result = el("div",{class:"result"},
      el("b",{},"这一选择带来的结果"),
      el("p",{}, choice.result)
    );
    storyNode.after(result);

    const isLast = state.step >= TOTAL_STEPS;
    const nextBtn = el("button",{
      style:"margin-top:4px",
      onclick: () => {
        if (isLast) {
          finishGame();
        } else {
          state.step += 1;
          renderPlay();
        }
      }
    }, isLast ? "看结局" : `继续 →  第 ${state.step+1} / ${TOTAL_STEPS} 步`);
    // 替换选项区为继续按钮
    choicesNode.replaceChildren(nextBtn);
    // 滚动到结果，确保移动端能看到
    requestAnimationFrame(() => {
      result.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }

  function finishGame(){
    state.ending = makeEnding();
    state.view = "ending";
    renderEnding();
  }

  function makeEnding(){
    const candidates = ENDINGS.filter(e => e.test(state.stats));
    let chosen;
    if (candidates.length){
      const maxW = Math.max(...candidates.map(c=>c.w));
      chosen = pick(candidates.filter(c=>c.w===maxW));
    } else {
      chosen = pick(ENDINGS);
    }
    const title = chosen.title.includes(state.role.name) ? chosen.title : `${state.role.name}版${chosen.title}`;
    return {
      title,
      rawTitle: chosen.title,
      desc: chosen.desc,
      share: buildShareText(title)
    };
  }

  function buildShareText(title){
    // 拿一条最戏剧化的历史
    const highlight = state.history
      .slice()
      .sort((a,b)=>{
        const sum = x => Object.values(x.effects).reduce((s,v)=>s+Math.abs(v),0);
        return sum(b) - sum(a);
      })[0];
    const tail = highlight ? `\n关键时刻：${highlight.choice} → ${highlight.result}` : "";
    return `我在《一分钟人生岔路口》里活成了：${title}${tail}`;
  }

  function renderEnding(){
    // 解锁记录（按未带身份前缀的原始 title）
    const isNew = addUnlocked(state.ending.rawTitle);
    const unlocked = getUnlocked().length;

    const recap = el("div",{class:"recap"});
    state.history.forEach(h=>{
      recap.appendChild(el("div",{},
        el("b",{}, String(h.step)),
        el("span",{}, `${h.choice} — ${h.result}`)
      ));
    });

    const shareBox = el("div",{class:"share",id:"shareText"}, state.ending.share);
    const toast = el("div",{class:"toast"});

    const titleNode = el("h2",{}, state.ending.title);
    if (isNew) titleNode.appendChild(el("span",{class:"pill"},"✨ 新解锁"));

    const card = el("section",{class:"card"},
      el("div",{class:"topline"}, el("span",{},"你的平行人生结局"), el("span",{}, `已解锁 ${unlocked} / ${ENDINGS.length}`)),
      el("div",{class:"ending-box"},
        titleNode,
        el("p",{class:"subtitle",style:"margin-top:10px"}, state.ending.desc)
      ),
      statsBlock(state.stats),
      el("details",{},
        el("summary",{style:"cursor:pointer;color:#536174;font-size:13px;padding:4px 0"},"展开 6 步回顾"),
        recap
      ),
      shareBox,
      el("div",{class:"row"},
        el("button",{onclick:()=>copyShare(shareBox, toast)},"复制分享文案"),
        el("button",{class:"secondary",onclick:resetAll},"再来一次")
      ),
      toast
    );
    mount(card);
  }

  function copyShare(node, toast){
    const text = state.ending.share;
    const showToast = msg => {
      toast.textContent = msg;
      toast.style.opacity = "1";
      clearTimeout(copyShare._t);
      copyShare._t = setTimeout(()=>{ toast.style.opacity = "0"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(()=>showToast("分享文案已复制。"))
        .catch(()=>{ selectNode(node); showToast("已选中文案，长按复制。"); });
    } else {
      selectNode(node);
      showToast("已选中文案，长按复制。");
    }
  }

  function selectNode(node){
    if (!window.getSelection) return;
    const range = document.createRange();
    range.selectNodeContents(node);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function resetAll(){
    state.view = "start";
    state.role = null;
    state.step = 0;
    state.eventQueue = [];
    state.history = [];
    state.ending = null;
    state.stats = {mood:50,money:50,luck:50,crazy:50};
    if (typingTimer){ clearInterval(typingTimer); typingTimer = null; }
    viewStart();
  }

  // 启动
  viewStart();
})();
</script>
</body>
</html>
